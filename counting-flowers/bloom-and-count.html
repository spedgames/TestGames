<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Counting Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BEE8FA;
    --sky-bottom:#EAF7E4;
    --card-bg:#FFFDF6;
    --ink:#3B3226;
    --ink-soft:#6B5F4F;
    --sun:#FFC94A;

    --n1:#FF6F91; --n1-dark:#D94B70;
    --n2:#FFB03B; --n2-dark:#DB8E1C;
    --n3:#8E7CFF; --n3-dark:#6B57E0;
    --n4:#4FB6C9; --n4-dark:#2E93A6;
    --n5:#64B678; --n5-dark:#468F56;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Nunito',sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 65%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-y:auto;
    overflow-x:hidden;
    position:relative;
  }

  /* ambient sky decoration */
  .sun{
    position:fixed; top:28px; right:6%;
    width:76px; height:76px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFE49B, var(--sun));
    box-shadow:0 0 40px 10px rgba(255,201,74,.45);
    z-index:0;
  }
  .cloud{
    position:fixed; z-index:0; opacity:.85;
    background:#fff; border-radius:100px;
    filter:blur(.2px);
  }
  .cloud::before,.cloud::after{
    content:''; position:absolute; background:#fff; border-radius:100px;
  }
  .cloud1{ width:110px; height:36px; top:70px; left:8%; animation:drift 46s linear infinite; }
  .cloud1::before{ width:60px; height:60px; top:-26px; left:14px; }
  .cloud1::after{ width:44px; height:44px; top:-18px; left:56px; }
  .cloud2{ width:90px; height:30px; top:150px; left:70%; animation:drift 60s linear infinite reverse; }
  .cloud2::before{ width:48px; height:48px; top:-22px; left:10px; }
  .cloud2::after{ width:36px; height:36px; top:-14px; left:46px; }
  @keyframes drift{
    from{ transform:translateX(-40px); }
    to{ transform:translateX(calc(100vw + 40px)); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  .app{
    position:relative; z-index:1;
    width:100%; max-width:760px;
    padding:16px 18px 20px;
    display:flex; flex-direction:column; align-items:center;
    gap:12px;
  }

  header{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:'Baloo 2', sans-serif; font-weight:800;
    font-size:1.7rem; color:var(--ink);
  }
  .brand-mark{ font-size:1.9rem; line-height:1; }

  .mode-toggle{
    display:flex; background:#fff; border-radius:999px;
    padding:5px; box-shadow:0 3px 0 rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.06);
  }
  .mode-toggle button{
    border:none; background:transparent; cursor:pointer;
    font-family:'Baloo 2', sans-serif; font-weight:700; font-size:1.05rem;
    color:var(--ink-soft);
    padding:10px 20px; border-radius:999px;
    transition:background .15s ease, color .15s ease;
  }
  .mode-toggle button.active{
    background:linear-gradient(180deg,#8ACB68,#6FAE4E);
    color:#fff;
    box-shadow:0 3px 8px rgba(111,174,78,.4);
  }
  .sound-toggle{
    border:none; background:#fff; cursor:pointer;
    width:44px; height:44px; border-radius:50%;
    font-size:1.2rem; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.06);
    flex-shrink:0;
  }
  .header-right{ display:flex; align-items:center; gap:10px; }

  main.card{
    width:100%;
    background:var(--card-bg);
    border-radius:32px;
    box-shadow:0 14px 0 rgba(111,174,78,.14), 0 20px 40px rgba(59,50,38,.12);
    padding:20px 22px 24px;
    display:flex; flex-direction:column; align-items:center; gap:12px;
    justify-content:center;
  }

  .progress-row{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center;
  }
  .progress-dot{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1rem;
    border:2.5px solid #E3DCC9; color:#B6AC94; background:#fff;
    transition:all .2s ease;
  }
  .progress-dot.done{ background:var(--n5); border-color:var(--n5-dark); color:#fff; }
  .progress-dot.current{ border-color:var(--ink); color:var(--ink); transform:scale(1.12); }

  .trial-label{
    font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--ink-soft);
    font-size:1.05rem;
  }

  .progress-bar-track{
    width:100%; max-width:400px; height:16px; border-radius:999px;
    background:#E9E2CC; overflow:hidden;
  }
  .progress-bar-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg,#8ACB68,#6FAE4E);
    transition:width .35s ease;
  }

  .prompt{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.5rem;
    line-height:1.3;
    color:var(--ink);
    min-height:2.2em;
    display:flex; align-items:center; justify-content:center; gap:.35em; flex-wrap:wrap;
  }
  .prompt .big-num{
    font-size:2.3rem;
    font-weight:800;
  }

  .scene-wrap{
    width:100%; max-width:500px;
    border-radius:22px;
    overflow:hidden;
    background:linear-gradient(180deg, #DFF3FC 0%, #EDF8E6 100%);
    position:relative;
  }
  .scene-wrap svg{ display:block; width:100%; height:auto; }

  .subprompt{
    font-size:1.1rem; color:var(--ink-soft); font-weight:700; text-align:center;
    min-height:1.5em;
  }
  .subprompt.correct{ color:var(--n5-dark); }
  .subprompt.incorrect{ color:var(--n1-dark); }

  .btn-row{
    display:flex; gap:14px; flex-wrap:wrap; justify-content:center;
  }
  .num-btn{
    --c: var(--n1); --cd: var(--n1-dark);
    width:88px; height:88px; border-radius:22px; border:none;
    font-family:'Baloo 2', sans-serif; font-weight:800; font-size:2.4rem;
    color:#fff; background:var(--c);
    box-shadow:0 7px 0 var(--cd), 0 10px 16px rgba(0,0,0,.14);
    cursor:pointer;
    transition:transform .08s ease, box-shadow .08s ease, filter .15s ease;
    position:relative;
  }
  .num-btn:active{ transform:translateY(5px); box-shadow:0 2px 0 var(--cd), 0 4px 8px rgba(0,0,0,.14); }
  .num-btn:disabled{ opacity:.55; cursor:default; }
  .num-btn:focus-visible{ outline:3px solid #3B3226; outline-offset:4px; }
  .num-btn.glow{ animation:glow 1.4s ease-in-out infinite; }
  @keyframes glow{
    0%,100%{ box-shadow:0 7px 0 var(--cd), 0 10px 16px rgba(0,0,0,.14), 0 0 0 0 rgba(255,255,255,.7); }
    50%{ box-shadow:0 7px 0 var(--cd), 0 10px 16px rgba(0,0,0,.14), 0 0 0 10px rgba(255,255,255,0); }
  }
  .num-btn.shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(4px); }
  }
  .num-btn.pop{ animation:pop .4s ease; }
  @keyframes pop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); }
    100%{ transform:scale(1); }
  }

  .start-screen{
    display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center;
    padding:8px 4px;
  }
  .start-title{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.9rem; }
  .start-sub{ color:var(--ink-soft); font-size:1.1rem; margin-bottom:10px; }
  .start-options{
    display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:8px;
  }
  .start-card{
    width:210px; border:none; border-radius:24px; cursor:pointer;
    background:#fff; padding:26px 18px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    box-shadow:0 7px 0 rgba(0,0,0,.08), 0 10px 18px rgba(59,50,38,.1);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .start-card:hover{ transform:translateY(-3px); }
  .start-card:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.08), 0 4px 8px rgba(59,50,38,.1); }
  .start-card:focus-visible{ outline:3px solid #3B3226; outline-offset:4px; }
  .start-card.learn{ border-bottom:6px solid var(--n5); }
  .start-card.try{ border-bottom:6px solid var(--n3); }
  .start-emoji{ font-size:2.6rem; }
  .start-label{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.3rem; }
  .start-desc{ color:var(--ink-soft); font-size:.95rem; line-height:1.35; }

  .end-screen{
    display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center;
    padding:12px 8px;
  }
  .end-emoji{ font-size:3.4rem; }
  .end-title{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.8rem; }
  .end-sub{ color:var(--ink-soft); font-size:1.15rem; max-width:420px; }
  .end-actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .action-btn{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.05rem;
    border:none; border-radius:16px; padding:14px 26px; cursor:pointer; color:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
    transition:transform .08s ease;
  }
  .action-btn:active{ transform:translateY(4px); box-shadow:none; }
  .action-btn.primary{ background:linear-gradient(180deg,#8ACB68,#6FAE4E); }
  .action-btn.secondary{ background:linear-gradient(180deg,#9FCFEE,#6FA9D8); }

  .petal-fall{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .petal{
    position:absolute; top:-40px; font-size:1.4rem;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:.2; }
  }

  footer{
    color:var(--ink-soft); font-size:.85rem; opacity:.7; text-align:center;
  }

  @media (max-width:480px){
    .num-btn{ width:68px; height:68px; font-size:1.8rem; border-radius:18px; }
    .prompt{ font-size:1.15rem; }
    .prompt .big-num{ font-size:1.7rem; }
    main.card{ padding:18px 12px 20px; gap:10px; }
    .brand{ font-size:1.2rem; }
    .app{ gap:10px; padding:10px 12px 14px; }
  }
</style>
</head>
<body>

  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>

  <div class="app">
    <header>
      <div class="brand"><span class="brand-mark">🌷</span> Counting Flowers</div>
      <div class="header-right">
        <div class="mode-toggle">
          <button id="modeLearnBtn">Learn</button>
          <button id="modeTryBtn">Try</button>
        </div>
        <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound" title="Toggle sound">🔊</button>
      </div>
    </header>

    <main class="card" id="card" aria-live="polite">
      <!-- content injected by JS -->
    </main>

    <footer>Tap a number to answer. Made for little gardeners.</footer>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- palette & flower data ---------- */
  const NUMBER_COLORS = {1:'var(--n1)',2:'var(--n2)',3:'var(--n3)',4:'var(--n4)',5:'var(--n5)'};
  const NUMBER_HEX    = {1:'#FF6F91',2:'#FFB03B',3:'#8E7CFF',4:'#4FB6C9',5:'#64B678'};
  const NUMBER_FLOWER  = {1:'🌷',2:'🌻',3:'🌸',4:'🌼',5:'🏵️'};
  const FLOWER_EMOJIS  = ['🌸','🌻','🌷','🌼','🏵️'];

  const BUSH_TOP = 268;
  const POSITIONS = {
    1: [{x:320,h:78}],
    2: [{x:220,h:72},{x:420,h:86}],
    3: [{x:160,h:78},{x:320,h:92},{x:480,h:72}],
    4: [{x:120,h:72},{x:260,h:90},{x:390,h:75},{x:520,h:88}],
    5: [{x:90,h:75},{x:210,h:90},{x:320,h:68},{x:430,h:92},{x:550,h:78}]
  };

  const BUSH_BASE = `
    <path d="M0,262 C 100,232 180,252 320,247 C 460,242 560,256 640,238 L640,420 L0,420 Z" fill="#8FCB6C"/>
    <ellipse cx="320" cy="302" rx="235" ry="72" fill="#6FAE4E"/>
    <ellipse cx="175" cy="292" rx="120" ry="55" fill="#7BBE5A"/>
    <ellipse cx="465" cy="290" rx="130" ry="58" fill="#7BBE5A"/>
    <ellipse cx="320" cy="270" rx="175" ry="66" fill="#8ACB68"/>
  `;

  function flowerMarkup(x, h, emoji, scale, leafSide){
    const topY = BUSH_TOP - h;
    const midY = BUSH_TOP - h*0.5;
    const sway = 14;
    const stemEnd = topY + 15;
    const stem = `<path d="M ${x} ${BUSH_TOP+6} Q ${x+sway} ${midY} ${x} ${stemEnd}" stroke="#4C8C3F" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    const leafX = x + sway*0.5 + leafSide*10;
    const leaf = `<ellipse cx="${leafX}" cy="${midY+12}" rx="14" ry="7" fill="#5FA055" transform="rotate(${leafSide*35} ${leafX} ${midY+12})"/>`;
    const flower = `<text x="${x}" y="${topY}" font-size="${86*scale}" text-anchor="middle" dominant-baseline="central">${emoji}</text>`;
    return stem + leaf + flower;
  }

  function sceneSVG(count, emojiMode){
    const positions = POSITIONS[count];
    const scale = count <= 3 ? 1 : 0.86;
    const emoji = emojiMode === 'fixed'
      ? NUMBER_FLOWER[count]
      : FLOWER_EMOJIS[Math.floor(Math.random()*FLOWER_EMOJIS.length)];
    let flowers = '';
    positions.forEach((p,i)=>{
      flowers += flowerMarkup(p.x, p.h, emoji, scale, i%2===0?1:-1);
    });
    return `<svg viewBox="0 100 640 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A bush with ${count} flower${count===1?'':'s'}">${BUSH_BASE}${flowers}</svg>`;
  }

  /* ---------- sound ---------- */
  let soundOn = true;
  function beep(freq, duration, type){
    if(!soundOn) return;
    try{
      const ctx = window.__gCtx || (window.__gCtx = new (window.AudioContext||window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+duration/1000);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime+duration/1000+0.03);
    }catch(e){}
  }
  function soundCorrect(){ beep(523,140,'sine'); setTimeout(()=>beep(659,180,'sine'),110); }
  function soundCelebrate(){ beep(523,120,'sine'); setTimeout(()=>beep(659,120,'sine'),100); setTimeout(()=>beep(784,220,'sine'),210); }

  /* ---------- state ---------- */
  const state = {
    mode: 'learn',
    learnStep: 1,
    tryTrials: [],
    tryIndex: 0,
    tryFirstCorrect: 0,
    tryWrongThisTrial: false,
    locked: false
  };

  const card = document.getElementById('card');
  const modeLearnBtn = document.getElementById('modeLearnBtn');
  const modeTryBtn = document.getElementById('modeTryBtn');
  const soundToggle = document.getElementById('soundToggle');

  soundToggle.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔈';
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function generateTrials(){
    const base = [1,2,3,4,5];
    const extra = [];
    for(let i=0;i<3;i++) extra.push(1+Math.floor(Math.random()*5));
    let seq = shuffle(base.concat(extra));
    for(let i=1;i<seq.length;i++){
      if(seq[i]===seq[i-1]){
        for(let j=i+1;j<seq.length;j++){
          if(seq[j]!==seq[i-1]){ [seq[i],seq[j]]=[seq[j],seq[i]]; break; }
        }
      }
    }
    return seq;
  }

  /* ---------- START SCREEN ---------- */
  function renderStart(){
    modeLearnBtn.classList.remove('active');
    modeTryBtn.classList.remove('active');
    card.innerHTML = `
      <div class="start-screen">
        <div class="start-title">Welcome to the garden!</div>
        <div class="start-sub">Choose how you'd like to play.</div>
        <div class="start-options">
          <button class="start-card learn" id="startLearn">
            <div class="start-emoji">🌱</div>
            <div class="start-label">Learn</div>
            <div class="start-desc">See numbers 1 to 5 with flowers to match.</div>
          </button>
          <button class="start-card try" id="startTry">
            <div class="start-emoji">🔎</div>
            <div class="start-label">Try</div>
            <div class="start-desc">Count the flowers and tap the right number.</div>
          </button>
        </div>
      </div>
    `;
    document.getElementById('startLearn').addEventListener('click', ()=>switchMode('learn'));
    document.getElementById('startTry').addEventListener('click', ()=>switchMode('try'));
  }

  /* ---------- mode switching ---------- */
  function switchMode(mode){
    state.mode = mode;
    modeLearnBtn.classList.toggle('active', mode==='learn');
    modeTryBtn.classList.toggle('active', mode==='try');
    if(mode==='learn'){
      state.learnStep = 1;
      renderLearn();
    } else {
      startTrySession();
    }
  }
  modeLearnBtn.addEventListener('click', ()=>switchMode('learn'));
  modeTryBtn.addEventListener('click', ()=>switchMode('try'));

  /* ---------- number button row ---------- */
  function numberButtonsMarkup(){
    let html = '<div class="btn-row" id="btnRow">';
    for(let n=1;n<=5;n++){
      html += `<button class="num-btn" data-num="${n}" style="--c:${NUMBER_HEX[n]};--cd:${darken(n)}" aria-label="Number ${n}">${n}</button>`;
    }
    html += '</div>';
    return html;
  }
  function darken(n){
    const map = {1:'#D94B70',2:'#DB8E1C',3:'#6B57E0',4:'#2E93A6',5:'#468F56'};
    return map[n];
  }

  /* ---------- LEARN MODE ---------- */
  function renderLearn(){
    const n = state.learnStep;
    let dots = '<div class="progress-row">';
    for(let i=1;i<=5;i++){
      let cls = 'progress-dot';
      if(i<n) cls += ' done';
      else if(i===n) cls += ' current';
      dots += `<div class="${cls}">${i}</div>`;
    }
    dots += '</div>';

    card.innerHTML = `
      ${dots}
      <div class="prompt">This is <span class="big-num" style="color:${NUMBER_HEX[n]}">${n}</span>.</div>
      <div class="scene-wrap">${sceneSVG(n,'fixed')}</div>
      <div class="subprompt" id="subprompt">Tap ${n} below.</div>
      ${numberButtonsMarkup()}
    `;
    document.getElementById(`btnRow`).querySelector(`[data-num="${n}"]`).classList.add('glow');

    document.querySelectorAll('.num-btn').forEach(btn=>{
      btn.addEventListener('click', onLearnTap);
    });
  }

  function onLearnTap(e){
    if(state.locked) return;
    const tapped = parseInt(e.currentTarget.dataset.num,10);
    const target = state.learnStep;
    if(tapped === target){
      state.locked = true;
      soundCorrect();
      e.currentTarget.classList.add('pop');
      document.getElementById('subprompt').textContent = 'Yes! That\u2019s ' + target + '!';
      document.getElementById('subprompt').classList.add('correct');
      setTimeout(()=>{
        state.locked = false;
        if(target >= 5){
          renderLearnComplete();
        } else {
          state.learnStep = target + 1;
          renderLearn();
        }
      }, 750);
    } else {
      e.currentTarget.classList.add('shake');
      const sp = document.getElementById('subprompt');
      sp.textContent = 'Try tapping ' + target + '.';
      sp.classList.add('incorrect');
      setTimeout(()=>{
        e.currentTarget.classList.remove('shake');
        sp.classList.remove('incorrect');
        sp.textContent = 'Tap ' + target + ' below.';
      }, 550);
    }
  }

  function renderLearnComplete(){
    card.innerHTML = `
      <div class="end-screen">
        <div class="end-emoji">🌼🌻🌷</div>
        <div class="end-title">You counted every flower!</div>
        <div class="end-sub">1, 2, 3, 4, 5 — you know your garden numbers.</div>
        <div class="end-actions">
          <button class="action-btn primary" id="goTry">Try it yourself</button>
          <button class="action-btn secondary" id="replayLearn">Learn again</button>
        </div>
      </div>
    `;
    launchPetals();
    soundCelebrate();
    document.getElementById('goTry').addEventListener('click', ()=>{
      modeLearnBtn.classList.remove('active');
      modeTryBtn.classList.add('active');
      startTrySession();
    });
    document.getElementById('replayLearn').addEventListener('click', ()=>{
      state.learnStep = 1;
      renderLearn();
    });
  }

  /* ---------- TRY MODE ---------- */
  function startTrySession(){
    state.mode = 'try';
    state.tryTrials = generateTrials();
    state.tryIndex = 0;
    state.tryFirstCorrect = 0;
    renderTryTrial();
  }

  function renderTryTrial(){
    state.tryWrongThisTrial = false;
    const idx = state.tryIndex;
    const count = state.tryTrials[idx];

    const percent = Math.round((idx / state.tryTrials.length) * 100);
    let dots = `<div class="progress-bar-track" role="progressbar" aria-valuenow="${idx}" aria-valuemin="0" aria-valuemax="${state.tryTrials.length}" aria-label="Try mode progress"><div class="progress-bar-fill" style="width:${percent}%"></div></div>`;

    card.innerHTML = `
      ${dots}
      <div class="prompt">How many flowers?</div>
      <div class="scene-wrap">${sceneSVG(count,'random')}</div>
      <div class="subprompt" id="subprompt">Tap the number you count.</div>
      ${numberButtonsMarkup()}
    `;

    document.querySelectorAll('.num-btn').forEach(btn=>{
      btn.addEventListener('click', (e)=>onTryTap(e, count));
    });
  }

  function onTryTap(e, correctCount){
    if(state.locked) return;
    const tapped = parseInt(e.currentTarget.dataset.num,10);
    if(tapped === correctCount){
      state.locked = true;
      soundCorrect();
      e.currentTarget.classList.add('pop');
      if(!state.tryWrongThisTrial) state.tryFirstCorrect++;
      const sp = document.getElementById('subprompt');
      sp.textContent = 'Yes! That\u2019s ' + correctCount + '!';
      sp.classList.add('correct');
      document.querySelectorAll('.num-btn').forEach(b=>b.disabled=true);
      setTimeout(()=>{
        state.locked = false;
        state.tryIndex++;
        if(state.tryIndex >= state.tryTrials.length){
          renderTryResults();
        } else {
          renderTryTrial();
        }
      }, 750);
    } else {
      state.tryWrongThisTrial = true;
      e.currentTarget.classList.add('shake');
      e.currentTarget.disabled = true;
      const sp = document.getElementById('subprompt');
      sp.textContent = 'Not quite, count again!';
      sp.classList.add('incorrect');
      setTimeout(()=>{
        e.currentTarget.classList.remove('shake');
        e.currentTarget.disabled = false;
        sp.classList.remove('incorrect');
        sp.textContent = 'Tap the number you count.';
      }, 600);
    }
  }

  function renderTryResults(){
    const total = state.tryTrials.length;
    const score = state.tryFirstCorrect;
    let title, emoji;
    if(score >= 7){ title = 'Amazing counting!'; emoji='🏆🌸🌻'; }
    else if(score >= 5){ title = 'Great job counting!'; emoji='🌼🌷🦋'; }
    else { title = 'Nice counting practice!'; emoji='🌱🌸'; }

    card.innerHTML = `
      <div class="end-screen">
        <div class="end-emoji">${emoji}</div>
        <div class="end-title">${title}</div>
        <div class="end-sub">You got ${score} out of ${total} gardens right on the first try.</div>
        <div class="end-actions">
          <button class="action-btn primary" id="playAgain">Play again</button>
          <button class="action-btn secondary" id="backLearn">Back to Learn</button>
        </div>
      </div>
    `;
    launchPetals();
    soundCelebrate();
    document.getElementById('playAgain').addEventListener('click', startTrySession);
    document.getElementById('backLearn').addEventListener('click', ()=>{
      modeTryBtn.classList.remove('active');
      modeLearnBtn.classList.add('active');
      state.learnStep = 1;
      renderLearn();
    });
  }

  /* ---------- celebratory petals ---------- */
  function launchPetals(){
    const layer = document.createElement('div');
    layer.className = 'petal-fall';
    document.body.appendChild(layer);
    const emojis = ['🌸','🌼','🌻','✨','🦋'];
    for(let i=0;i<22;i++){
      const span = document.createElement('span');
      span.className = 'petal';
      span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      span.style.left = Math.random()*100 + 'vw';
      span.style.animationDuration = (2.4 + Math.random()*1.8) + 's';
      span.style.animationDelay = (Math.random()*0.6) + 's';
      span.style.fontSize = (1 + Math.random()*0.8) + 'rem';
      layer.appendChild(span);
    }
    setTimeout(()=>layer.remove(), 4600);
  }

  /* ---------- init ---------- */
  renderStart();
})();
</script>
</body>
</html>

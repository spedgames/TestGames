<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Turbo Dash — Controller</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root{
    --sky-top:#5c94fc;
    --sky-bottom:#a7d4ff;
    --player-red:#e52521;
    --player-blue:#0058f8;
    --coin:#fbd000;
    --grass:#00a800;
    --ink:#3a2a1a;
    --ink-dim:#7a6650;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    overflow:hidden;
    font-family:'Nunito',sans-serif; color:var(--ink);
    touch-action:none;
  }
  #status{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #status.hidden{ display:none; }
  .title{
    font-family:'Fredoka','Nunito',sans-serif;
    font-size:clamp(24px,7vw,34px); font-weight:700;
    color:var(--player-red);
    -webkit-text-stroke:1.2px var(--ink);
    margin-bottom:10px;
  }
  .msg{ font-size:16px; color:var(--ink); font-weight:800; letter-spacing:0.5px; }
  .pulse{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  #controls{
    position:fixed; inset:0; display:none;
    grid-template-columns:1fr 1fr; gap:6px; padding:6px;
    z-index:3;
  }
  #controls.active{ display:grid; }
  .btn{
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka','Nunito',sans-serif;
    font-size:clamp(26px,9vw,48px); font-weight:700; letter-spacing:1px;
    border-radius:20px;
    color:#fff;
    -webkit-text-stroke:1px var(--ink);
    box-shadow:0 6px 0 rgba(0,0,0,0.25);
    transition:transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
  }
  #btnLeft{ background:var(--player-blue); }
  #btnRight{ background:var(--player-red); }
  .btn.pressed{ filter:brightness(1.15); transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.25); }

  #gameover{
    position:fixed; inset:0; z-index:4; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    text-align:center; padding:24px;
  }
  #gameover.active{ display:flex; }
  .score{
    font-family:'Fredoka','Nunito',sans-serif;
    font-size:clamp(40px,14vw,72px); color:var(--coin); font-weight:700;
    -webkit-text-stroke:2px var(--ink);
    margin:4px 0 2px;
  }
  .best{ color:var(--ink); font-size:15px; margin-bottom:26px; font-weight:800; }
  #restartBtn{
    padding:18px 40px; font-size:20px; font-weight:800; letter-spacing:1px;
    border-radius:14px; border:none; color:#fff;
    background:var(--player-red);
    box-shadow:0 6px 0 rgba(0,0,0,0.25);
  }
  #restartBtn.pressed{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.25); }
</style>
</head>
<body>

<div id="status">
  <div class="title">TURBO DASH</div>
  <div class="msg pulse" id="statusMsg">Connecting to game…</div>
</div>

<div id="controls">
  <div class="btn" id="btnLeft">◀ LEFT</div>
  <div class="btn" id="btnRight">RIGHT ▶</div>
</div>

<div id="gameover">
  <div class="title">CRASHED</div>
  <div class="score" id="finalScore">0</div>
  <div class="best" id="bestScore">Best: 0</div>
  <div id="restartBtn">TAP TO RESTART</div>
</div>

<script>
var linkFonts = document.createElement('link');
linkFonts.rel = 'stylesheet';
linkFonts.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;700;800&display=swap';
document.head.appendChild(linkFonts);

var params = new URLSearchParams(window.location.search);
var hostId = params.get('host');
var statusMsg = document.getElementById('statusMsg');
var controlsEl = document.getElementById('controls');
var gameoverEl = document.getElementById('gameover');
var statusEl = document.getElementById('status');

function showScreen(which){
  statusEl.classList.add('hidden');
  controlsEl.classList.remove('active');
  gameoverEl.classList.remove('active');
  if(which === 'status') statusEl.classList.remove('hidden');
  if(which === 'controls') controlsEl.classList.add('active');
  if(which === 'gameover') gameoverEl.classList.add('active');
}

if(!hostId){
  statusMsg.textContent = 'No game found. Scan the QR code shown on the screen.';
} else {
  var peer = new Peer();
  var conn = null;

  peer.on('open', function(){
    conn = peer.connect(hostId, {reliable:true});

    conn.on('open', function(){
      statusMsg.textContent = 'Connected! Get ready…';
    });

    conn.on('data', function(msg){
      if(!msg || !msg.type) return;
      if(msg.type === 'state'){
        if(msg.state === 'playing'){
          showScreen('controls');
        } else if(msg.state === 'gameover'){
          document.getElementById('finalScore').textContent = msg.score;
          document.getElementById('bestScore').textContent = 'Best: ' + msg.best;
          showScreen('gameover');
        } else if(msg.state === 'ready'){
          showScreen('status');
          statusMsg.textContent = 'Get ready…';
        }
      }
    });

    conn.on('close', function(){
      statusMsg.textContent = 'Lost connection to game.';
      showScreen('status');
    });
  });

  peer.on('error', function(err){
    console.error(err);
    statusMsg.textContent = 'Connection error. Reopen this page from a fresh QR scan.';
    showScreen('status');
  });

  function send(msg){
    if(conn && conn.open){
      try{ conn.send(msg); }catch(e){}
    }
  }

  function bindHold(el, onDown, onUp){
    el.addEventListener('pointerdown', function(e){
      e.preventDefault();
      el.classList.add('pressed');
      onDown();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(evt){
      el.addEventListener(evt, function(e){
        el.classList.remove('pressed');
        onUp();
      });
    });
  }

  var btnLeft = document.getElementById('btnLeft');
  var btnRight = document.getElementById('btnRight');
  bindHold(btnLeft,
    function(){ send({type:'input', dir:'left', pressed:true}); },
    function(){ send({type:'input', dir:'left', pressed:false}); }
  );
  bindHold(btnRight,
    function(){ send({type:'input', dir:'right', pressed:true}); },
    function(){ send({type:'input', dir:'right', pressed:false}); }
  );

  var restartBtn = document.getElementById('restartBtn');
  restartBtn.addEventListener('pointerdown', function(e){
    e.preventDefault();
    restartBtn.classList.add('pressed');
    send({type:'restart'});
    setTimeout(function(){ restartBtn.classList.remove('pressed'); }, 150);
  });
}
</script>
</body>
</html>

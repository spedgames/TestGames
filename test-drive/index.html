<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Turbo Dash</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --sky-top:#5c94fc;
    --sky-bottom:#a7d4ff;
    --grass:#00a800;
    --grass-dark:#0a8a0a;
    --brick:#c84c0c;
    --brick-dark:#9c3a09;
    --road:#787878;
    --coin:#fbd000;
    --player-red:#e52521;
    --player-blue:#0058f8;
    --ink:#3a2a1a;
    --ink-dim:#7a6650;
    --panel:#fffdf6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--sky-top);
    font-family:'Nunito',sans-serif;
    color:var(--ink);
  }
  canvas{display:block; position:fixed; top:0; left:0;}

  #overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(92,148,252,0.35), rgba(167,212,255,0.55));
  }
  #overlay.hidden{display:none;}

  .card{
    background:var(--panel);
    border:6px solid var(--ink);
    border-radius:22px;
    padding:32px 40px;
    text-align:center;
    box-shadow:0 10px 0 rgba(58,42,26,0.25), 0 14px 30px rgba(0,0,0,0.25);
    max-width:90vw;
  }
  .title{
    font-family:'Fredoka', 'Nunito', sans-serif;
    font-size:clamp(28px,4vw,44px);
    font-weight:700;
    letter-spacing:1px;
    color:var(--player-red);
    -webkit-text-stroke:1.5px var(--ink);
    margin:0 0 6px 0;
  }
  .subtitle{
    color:var(--ink-dim); font-size:clamp(13px,1.6vw,16px);
    letter-spacing:1px; font-weight:700; margin-bottom:22px;
  }
  .ticket{
    display:inline-block; position:relative;
    background:#fff; border-radius:14px;
    padding:16px 18px 12px;
    border:4px dashed var(--coin);
  }
  #qrcode{ background:#fff; padding:8px; border-radius:6px; line-height:0; }
  #qrcode img{ display:block; }
  .ticket-label{
    font-size:13px; letter-spacing:1px; color:var(--player-blue);
    font-weight:800; margin-top:10px;
  }
  .status{
    margin-top:20px; font-size:16px; color:var(--player-blue);
    letter-spacing:0.5px; font-weight:800; min-height:20px;
  }
  .hint{
    margin-top:8px; font-size:12px; color:var(--ink-dim); font-weight:700;
  }
  .big-score{
    font-family:'Fredoka','Nunito',sans-serif;
    font-size:clamp(40px,7vw,64px);
    font-weight:700;
    color:var(--coin);
    -webkit-text-stroke:2px var(--ink);
    margin:6px 0 2px;
  }
  .best{ color:var(--ink-dim); font-size:14px; font-weight:800; margin-bottom:18px;}
  .pulse{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }

  #hud{
    position:fixed; top:16px; left:20px; z-index:5;
    font-family:'Fredoka','Nunito',sans-serif;
    font-size:clamp(18px,2.4vw,26px);
    font-weight:700;
    color:#fff;
    -webkit-text-stroke:1.5px var(--ink);
    letter-spacing:1px;
  }
  #hud.hidden{display:none;}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">SCORE <span id="liveScore">0</span></div>

<div id="overlay">
  <div class="card" id="cardContent">
    <div class="title">TURBO DASH</div>
    <div class="subtitle">Dodge traffic. Don't crash.</div>
    <div class="ticket">
      <div id="qrcode"></div>
      <div class="ticket-label">Scan to grab the wheel</div>
    </div>
    <div class="status pulse" id="statusText">Starting engine…</div>
    <div class="hint">Or press ← / → on this device to test without a phone</div>
  </div>
</div>

<script>
/* ---------- Fonts (Google Fonts via link, safe cross-origin asset) ---------- */
var link = document.createElement('link');
link.rel = 'stylesheet';
link.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;700;800&display=swap';
document.head.appendChild(link);

/* ---------- Canvas setup ---------- */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W, H, roadLeft, roadRight, roadWidth, horizonY;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  roadWidth = Math.min(W * 0.5, 460);
  roadLeft = (W - roadWidth) / 2;
  roadRight = roadLeft + roadWidth;
  horizonY = H * 0.16;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Game state ---------- */
var STATE = { LOBBY:'lobby', COUNTDOWN:'countdown', PLAYING:'playing', GAMEOVER:'gameover' };
var state = STATE.LOBBY;

var CAR_FACTOR = 0.105; // car width as a fraction of road width (smaller = more dodge room)

var player = { x: 0, vx: 0, w: 0, h: 0 };
var obstacles = [];
var clouds = [];
var laneOffset = 0;
var score = 0;
var best = Number(localStorage.getItem('turboDashBest') || 0);
var speed = 260;        // px/sec downward scroll speed
var spawnTimer = 0;
var spawnInterval = 1.1;
var elapsed = 0;
var lastTime = null;
var countdownVal = 3;
var countdownTimer = 0;

var keys = { left:false, right:false };
var input = { left:false, right:false };

function initClouds(){
  clouds = [];
  for(var i=0;i<5;i++){
    clouds.push({
      x: Math.random()*W,
      y: horizonY*0.15 + Math.random()*horizonY*0.5,
      s: 0.6 + Math.random()*0.8,
      v: 8 + Math.random()*10
    });
  }
}

function resetGame(){
  player.w = roadWidth * CAR_FACTOR;
  player.h = player.w * 1.7;
  player.x = (roadLeft + roadRight) / 2;
  player.vx = 0;
  obstacles = [];
  score = 0;
  speed = 260;
  spawnTimer = 0;
  spawnInterval = 1.1;
  elapsed = 0;
  laneOffset = 0;
  initClouds();
}
initClouds();

/* ---------- Drawing helpers ---------- */
function drawHorizon(dt){
  var grad = ctx.createLinearGradient(0,0,0,horizonY);
  grad.addColorStop(0, '#5c94fc');
  grad.addColorStop(1, '#a7d4ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,horizonY);

  // sun
  ctx.save();
  ctx.fillStyle = '#fbd000';
  ctx.beginPath();
  ctx.arc(W*0.84, horizonY*0.35, horizonY*0.32, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // clouds
  ctx.save();
  ctx.fillStyle = '#ffffff';
  for(var i=0;i<clouds.length;i++){
    var c = clouds[i];
    c.x += c.v*dt;
    if(c.x - 60*c.s > W) c.x = -60*c.s;
    drawCloud(c.x, c.y, c.s);
  }
  ctx.restore();

  // distant green hills
  ctx.fillStyle = 'var(--grass-dark)';
  ctx.fillStyle = '#0a8a0a';
  ctx.beginPath();
  ctx.moveTo(0, horizonY);
  ctx.quadraticCurveTo(W*0.2, horizonY-18, W*0.42, horizonY);
  ctx.quadraticCurveTo(W*0.68, horizonY-24, W*0.85, horizonY);
  ctx.quadraticCurveTo(W*0.95, horizonY-10, W, horizonY);
  ctx.lineTo(W, horizonY);
  ctx.lineTo(0, horizonY);
  ctx.fill();
}

function drawCloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x, y, 14*s, 0, Math.PI*2);
  ctx.arc(x+16*s, y-6*s, 16*s, 0, Math.PI*2);
  ctx.arc(x+34*s, y, 14*s, 0, Math.PI*2);
  ctx.arc(x+16*s, y+6*s, 15*s, 0, Math.PI*2);
  ctx.fill();
}

function drawBush(x,y,s){
  ctx.save();
  ctx.fillStyle = '#00a800';
  ctx.beginPath();
  ctx.arc(x, y, 10*s, 0, Math.PI*2);
  ctx.arc(x+11*s, y-4*s, 12*s, 0, Math.PI*2);
  ctx.arc(x+22*s, y, 10*s, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#0a8a0a';
  ctx.beginPath();
  ctx.arc(x+8*s, y+3*s, 6*s, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawRoad(dt){
  // grass either side
  ctx.fillStyle = '#00a800';
  ctx.fillRect(0, horizonY, W, H-horizonY);

  // brick curb
  var curbW = 14;
  ctx.fillStyle = '#c84c0c';
  ctx.fillRect(roadLeft-curbW, horizonY, curbW, H-horizonY);
  ctx.fillRect(roadRight, horizonY, curbW, H-horizonY);
  ctx.strokeStyle = '#9c3a09';
  ctx.lineWidth = 2;
  for(var by=horizonY; by<H; by+=16){
    ctx.beginPath();
    ctx.moveTo(roadLeft-curbW, by); ctx.lineTo(roadLeft, by);
    ctx.moveTo(roadRight, by); ctx.lineTo(roadRight+curbW, by);
    ctx.stroke();
  }

  // asphalt
  ctx.fillStyle = '#787878';
  ctx.fillRect(roadLeft, horizonY, roadWidth, H-horizonY);

  laneOffset += speed * dt;

  // bushes scrolling along the grass edge
  var bushSpacing = 110;
  var bOffset = laneOffset % bushSpacing;
  for(var y = horizonY - bushSpacing + bOffset; y < H; y += bushSpacing){
    drawBush(roadLeft - curbW - 34, y, 1);
    drawBush(roadRight + curbW + 6, y, 1);
  }

  // dashed center line
  var dashLen = 34, gap = 26, total = dashLen+gap;
  var dOffset = laneOffset % total;
  ctx.fillStyle = '#ffffff';
  for(var yy = horizonY - total + dOffset; yy < H; yy += total){
    ctx.fillRect((roadLeft+roadRight)/2 - 3, yy, 6, dashLen);
  }
}

function drawCar(x, y, w, h, bodyColor, trimColor){
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(0, h*0.46, w*0.48, h*0.12, 0, 0, Math.PI*2);
  ctx.fill();
  // body
  ctx.fillStyle = bodyColor;
  roundRect(-w/2, -h/2, w, h, w*0.24);
  ctx.fill();
  // windshield
  ctx.fillStyle = '#bfe6ff';
  roundRect(-w*0.3, -h*0.3, w*0.6, h*0.26, w*0.12);
  ctx.fill();
  // trim stripe
  ctx.fillStyle = trimColor;
  ctx.fillRect(-w*0.5, h*0.02, w, h*0.12);
  // lights
  ctx.fillStyle = '#fff7cc';
  ctx.fillRect(-w*0.4, -h*0.48, w*0.16, h*0.08);
  ctx.fillRect(w*0.24, -h*0.48, w*0.16, h*0.08);
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- Game logic ---------- */
function spawnObstacle(){
  var w = roadWidth * CAR_FACTOR;
  var h = w * 1.7;
  var margin = w*0.7;
  var x = roadLeft + margin + Math.random() * (roadWidth - margin*2);
  var colors = [
    {b:'#0058f8', t:'#fff7cc'},
    {b:'#fbd000', t:'#e52521'},
    {b:'#00a800', t:'#ffffff'},
    {b:'#8a4bff', t:'#fff7cc'}
  ];
  var c = colors[Math.floor(Math.random()*colors.length)];
  obstacles.push({x:x, y:horizonY-h, w:w, h:h, color:c.b, trim:c.t});
}

function updatePlaying(dt){
  elapsed += dt;
  score += dt * 12;
  speed = 260 + elapsed * 9;
  spawnInterval = Math.max(0.45, 1.1 - elapsed*0.02);

  // steering
  var accel = 1600, friction = 1400, maxV = 620;
  var steer = (input.left || keys.left ? -1:0) + (input.right || keys.right ? 1:0);
  if(steer !== 0){
    player.vx += steer * accel * dt;
    player.vx = Math.max(-maxV, Math.min(maxV, player.vx));
  } else {
    if(player.vx > 0) player.vx = Math.max(0, player.vx - friction*dt);
    else if(player.vx < 0) player.vx = Math.min(0, player.vx + friction*dt);
  }
  player.x += player.vx * dt;
  var minX = roadLeft + player.w/2 + 6;
  var maxX = roadRight - player.w/2 - 6;
  if(player.x < minX){ player.x = minX; player.vx = 0; }
  if(player.x > maxX){ player.x = maxX; player.vx = 0; }

  // spawn
  spawnTimer += dt;
  if(spawnTimer >= spawnInterval){
    spawnTimer = 0;
    spawnObstacle();
  }

  // move obstacles + collision (slightly shrunk hitbox for a fairer feel)
  var hitPad = 0.82;
  var carTop = H-120 - (player.h*hitPad)/2, carBottom = H-120 + (player.h*hitPad)/2;
  var carLeft = player.x - (player.w*hitPad)/2, carRight = player.x + (player.w*hitPad)/2;
  for(var i=obstacles.length-1;i>=0;i--){
    var o = obstacles[i];
    o.y += speed * dt;
    if(o.y > H + 100){ obstacles.splice(i,1); continue; }
    var oLeft = o.x-(o.w*hitPad)/2, oRight = o.x+(o.w*hitPad)/2, oTop = o.y+o.h*(1-hitPad)/2, oBottom = o.y+o.h-o.h*(1-hitPad)/2;
    if(carLeft < oRight && carRight > oLeft && carTop < oBottom && carBottom > oTop){
      triggerGameOver();
      return;
    }
  }

  document.getElementById('liveScore').textContent = Math.floor(score);
}

function triggerGameOver(){
  state = STATE.GAMEOVER;
  var finalScore = Math.floor(score);
  if(finalScore > best){
    best = finalScore;
    localStorage.setItem('turboDashBest', String(best));
  }
  document.getElementById('hud').classList.add('hidden');
  showOverlay();
  document.getElementById('cardContent').innerHTML =
    '<div class="title">CRASHED</div>' +
    '<div class="big-score">' + finalScore + '</div>' +
    '<div class="best">Best: ' + best + '</div>' +
    '<div class="status pulse" id="statusText">Waiting for restart on phone…</div>' +
    '<div class="hint">Or press SPACE on this device</div>';
  sendToController({type:'state', state:'gameover', score:finalScore, best:best});
}

function startCountdown(){
  state = STATE.COUNTDOWN;
  countdownVal = 3;
  countdownTimer = 0;
  showOverlay();
  renderCountdownCard();
}

function renderCountdownCard(){
  document.getElementById('cardContent').innerHTML =
    '<div class="title">GET READY</div>' +
    '<div class="big-score">' + countdownVal + '</div>' +
    '<div class="hint">Use LEFT / RIGHT to dodge traffic</div>';
}

function startPlaying(){
  state = STATE.PLAYING;
  resetGame();
  hideOverlay();
  document.getElementById('hud').classList.remove('hidden');
  sendToController({type:'state', state:'playing'});
}

function showOverlay(){ document.getElementById('overlay').classList.remove('hidden'); }
function hideOverlay(){ document.getElementById('overlay').classList.add('hidden'); }

/* ---------- Main loop ---------- */
function frame(t){
  if(lastTime === null) lastTime = t;
  var dt = Math.min(0.05, (t-lastTime)/1000);
  lastTime = t;

  ctx.clearRect(0,0,W,H);
  drawHorizon(dt);
  drawRoad(dt);

  if(state === STATE.COUNTDOWN){
    countdownTimer += dt;
    if(countdownTimer >= 1){
      countdownTimer = 0;
      countdownVal -= 1;
      if(countdownVal <= 0){ startPlaying(); }
      else { renderCountdownCard(); }
    }
    var pw = roadWidth * CAR_FACTOR;
    drawCar((roadLeft+roadRight)/2, H-120, pw, pw*1.7, '#e52521', '#0058f8');
  }

  if(state === STATE.PLAYING){
    updatePlaying(dt);
    for(var i=0;i<obstacles.length;i++){
      var o = obstacles[i];
      drawCar(o.x, o.y + o.h/2, o.w, o.h, o.color, o.trim);
    }
    if(state === STATE.PLAYING){
      drawCar(player.x, H-120, player.w, player.h, '#e52521', '#0058f8');
    }
  }

  if(state === STATE.GAMEOVER){
    for(var j=0;j<obstacles.length;j++){
      var oo = obstacles[j];
      drawCar(oo.x, oo.y + oo.h/2, oo.w, oo.h, oo.color, oo.trim);
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Keyboard fallback (testing without a phone) ---------- */
window.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft') keys.left = true;
  if(e.key === 'ArrowRight') keys.right = true;
  if(e.key === ' ' && state === STATE.GAMEOVER) startCountdown();
});
window.addEventListener('keyup', function(e){
  if(e.key === 'ArrowLeft') keys.left = false;
  if(e.key === 'ArrowRight') keys.right = false;
});

/* ---------- PeerJS pairing ---------- */
var peer = null;
var conn = null;

function setStatus(msg){
  var el = document.getElementById('statusText');
  if(el) el.textContent = msg;
}

function sendToController(msg){
  if(conn && conn.open){
    try{ conn.send(msg); }catch(e){}
  }
}

function initPeer(){
  peer = new Peer();
  peer.on('open', function(id){
    var controllerUrl = new URL('controller.html', window.location.href);
    controllerUrl.searchParams.set('host', id);
    document.getElementById('qrcode').innerHTML = '';
    new QRCode(document.getElementById('qrcode'), {
      text: controllerUrl.toString(),
      width: 200,
      height: 200,
      colorDark: '#3a2a1a',
      colorLight: '#ffffff'
    });
    setStatus('Waiting for phone to connect…');
  });

  peer.on('connection', function(c){
    conn = c;
    conn.on('open', function(){
      setStatus('Phone connected!');
      setTimeout(startCountdown, 700);
    });
    conn.on('data', function(msg){
      if(!msg || !msg.type) return;
      if(msg.type === 'input'){
        if(msg.dir === 'left') input.left = msg.pressed;
        if(msg.dir === 'right') input.right = msg.pressed;
      } else if(msg.type === 'restart'){
        if(state === STATE.GAMEOVER) startCountdown();
      }
    });
    conn.on('close', function(){
      setStatus('Phone disconnected. Rescan to reconnect.');
    });
  });

  peer.on('error', function(err){
    console.error(err);
    setStatus('Connection error: ' + err.type + '. Retrying…');
    setTimeout(initPeer, 2000);
  });
}
initPeer();
</script>
</body>
</html>
